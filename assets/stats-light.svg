<g class="reveal" style="animation-delay:0.00s"><text class="num" x="40.0" y="108" fill="#161616">11</text><text class="lbl" x="40.0" y="132" fill="#6A6762">Public projects</text></g>
<g class="reveal" style="animation-delay:0.04s"><text class="num" x="326.0" y="108" fill="#161616">4</text><text class="lbl" x="326.0" y="132" fill="#6A6762">Stars</text></g>
<g class="reveal" style="animation-delay:0.08s"><text class="num" x="612.0" y="108" fill="#161616">941</text><text class="lbl" x="612.0" y="132" fill="#6A6762">Contributions, all time</text></g>
<g class="reveal" style="animation-delay:0.12s"><text class="num" x="898.0" y="108" fill="#161616">6</text><text class="lbl" x="898.0" y="132" fill="#6A6762">Followers</text></g>
<line x1="40" y1="156" x2="1160" y2="156" stroke="#E2DDD6" stroke-width="1"/>
