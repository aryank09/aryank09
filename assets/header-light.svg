<title>Aryan Khanna</title>
<style><![CDATA[
  .kicker { font: 500 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.22em; text-transform: uppercase; }
  .word { font: 600 78px ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: 0.04em; }
  .sub { font: 500 15px ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: 0.04em; }
  .caption { font: 500 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.18em; text-transform: uppercase; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes draw { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes pop { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
  .tagline { font: 500 14px ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: 0.04em; opacity: 1; }
  .letter { opacity: 1; animation: rise 0.7s cubic-bezier(0.23, 1, 0.32, 1) forwards; }
  .ghost { opacity: 1; }
  .line { transform-box: fill-box; transform-origin: left center; animation: draw 0.8s cubic-bezier(0.23, 1, 0.32, 1) 0.2s forwards; }
  .fade { opacity: 1; animation: rise 0.6s cubic-bezier(0.23, 1, 0.32, 1) forwards; }
  .dot { opacity: 1; animation: pop 0.45s cubic-bezier(0.23, 1, 0.32, 1) forwards; }
  .panel { opacity: 1; animation: rise 0.7s cubic-bezier(0.23, 1, 0.32, 1) 0.15s forwards; }
  .tagline { animation: rise 0.6s cubic-bezier(0.23, 1, 0.32, 1) forwards; }
  @media (prefers-reduced-motion: reduce) {
    .letter, .line, .fade, .dot, .panel, .tagline { animation: none; opacity: 1; }
  }
]]></style>
